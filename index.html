<head>

     <style>
        body{
            background-image: url('https://i.pinimg.com/originals/f1/28/19/f12819e3fe438dbe106978cb5f54d2d8.gif');
            background-size: cover;
            background-repeat:no-repeat;
        }

        .title{
            display:flex; 
            text-align:  center;
            font-size:large;
            font-family: Lucida Console;
            color:rgb(92, 241, 255);
            text-shadow: 2px 2px 5px rgba(249, 245, 245, 0.626);
            background-color: rgba(121, 221, 221, 0.478);
            border-radius:3px;
            box-shadow: 2px 2px 5px rgba(249, 245, 245, 0.626);

        }
        
        .form2{
            display:flex; 
            text-align:  center;
            background-color: rgba(99, 179, 179, 0.371);
            border-radius:3px;
            box-shadow: 2px 2px 5px rgba(249, 245, 245, 0.626); 
        }
         
        .head2{
             display:flex; 
            text-align:  center;
            font-size:large;
            font-family: Lucida Console;
            color:rgb(240, 240, 240);
            text-shadow: 2px 2px 5px rgba(127, 127, 127, 0.626);
        }

        .instructions{
             display:flex; 
            text-align:  center;
            font-size:large;
            font-family: Lucida Console;
            color:rgb(197, 244, 248);
            text-shadow: 2px 2px 5px rgba(127, 127, 127, 0.626);
        }

        .form3{
            display:flex; 
            text-align:  center;
            background-color: rgba(99, 179, 179, 0.371);
            border-radius:3px;
            box-shadow: 2px 2px 5px rgba(249, 245, 245, 0.626);
            font-family: Lucida Console;
              color:rgb(240, 240, 240);
            text-shadow: 2px 2px 5px rgba(127, 127, 127, 0.626);
        }

    </style>

<!--
      =Note to self: form2 is labeled 2 cus of title's 'form'
    -->


</head>
<body>

<div class="title" role="">
    <h1> ⚗️🫧Periodic Table Information Finder</h1>
</div>

<br><br>

<form>
    <div class="form2" role="" style="display:flex;">

     <div class="head2" role="">
        <h2>• Non Metal Elements || </h2>
    </div>
    
    <br>

    <div class="instructions" role="">
        <h3> Enter the symbol of a non-metal element(Example: H, O, CI, Ne, Xe)</h3>
    </div>

    </div>

    <br>

    <div class="form3" role="">
        <label for="inputE">Input Element Symbol</label>
        
        <input type="text" id="TextE" placeholder="🧪🧪🧪.. .">

        <br>
    </div>
</form>
      

    
</body>
